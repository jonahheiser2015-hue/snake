<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game">
        <canvas id="canvas" width="720" height="480" class="canvas"></canvas>
        <div class="punkte">
            <h1>SCORE:</h1>
            <h2 id="score">0</h2>
        </div>
    </div>
 <div class="controls-container">
            <button class="btn" onmousedown="setDirection('UP')" ontouchstart="setDirection('UP')">▲</button>
            <div class="row">
                <button class="btn" onmousedown="setDirection('LEFT')" ontouchstart="setDirection('LEFT')">◀</button>
                <button class="btn" onmousedown="setDirection('RIGHT')" ontouchstart="setDirection('RIGHT')">▶</button>
            </div>
            <button class="btn" onmousedown="setDirection('DOWN')" ontouchstart="setDirection('DOWN')">▼</button>
        </div>
    </div>
    <script src="script.js"></script>

</body>
</html>
